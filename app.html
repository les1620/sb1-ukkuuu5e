<!DOCTYPE html>
<html lang="fr-CA">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="Bible Compagnon - Votre compagnon de lecture biblique quotidien">
    <meta name="theme-color" content="#6B5DD3">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">

    <title>Bible Compagnon</title>

    <link rel="manifest" href="/manifest.json">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='45' fill='%236B5DD3'/%3E%3Cpath d='M35 40h30v5H35zM35 50h30v5H35zM35 60h20v5H35z' fill='white'/%3E%3C/svg%3E">

    <style>
        /* Reset & Variables */
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --violet: #6B5DD3;
            --violet-dark: #5B4DC3;
            --violet-light: #8B7DE8;
            --black: #1A1A1A;
            --gray: #6B7280;
            --gray-light: #F3F4F6;
            --white: #FFFFFF;
            --bg-primary: #FFFFFF;
            --bg-secondary: #F9FAFB;
            --text-primary: #1A1A1A;
            --text-secondary: #6B7280;
            --border-color: #E5E7EB;
        }

        [data-theme="dark"] {
            --bg-primary: #1A1A1A;
            --bg-secondary: #2D2D2D;
            --text-primary: #F9FAFB;
            --text-secondary: #9CA3AF;
            --border-color: #374151;
            --gray-light: #374151;
        }

        html {
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif;
            font-size: 18px;
            line-height: 1.8;
            color: var(--text-primary);
            background: var(--bg-primary);
            overflow-x: hidden;
            padding-bottom: 80px;
        }

        /* Header */
        .header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: var(--bg-primary);
            backdrop-filter: blur(10px);
            padding: 12px 20px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .header-title {
            font-size: 18px;
            font-weight: 700;
            color: var(--text-primary);
        }

        .header-actions {
            display: flex;
            gap: 12px;
        }

        .icon-btn {
            background: none;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: var(--text-primary);
            transition: background 0.2s;
        }

        .icon-btn:hover {
            background: var(--gray-light);
        }

        .icon-btn svg {
            width: 24px;
            height: 24px;
        }

        /* Book Selector */
        .book-selector {
            position: sticky;
            top: 65px;
            z-index: 99;
            background: var(--bg-secondary);
            padding: 12px 20px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            gap: 12px;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        .book-selector::-webkit-scrollbar {
            display: none;
        }

        .book-btn {
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            white-space: nowrap;
            cursor: pointer;
            color: var(--text-primary);
            transition: all 0.2s;
        }

        .book-btn.active {
            background: var(--violet);
            color: white;
            border-color: var(--violet);
        }

        /* Chapter Selector */
        .chapter-selector {
            padding: 20px;
            background: var(--bg-primary);
        }

        .chapter-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(60px, 1fr));
            gap: 12px;
            margin-top: 12px;
        }

        .chapter-btn {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            padding: 16px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            color: var(--text-primary);
            transition: all 0.2s;
            min-height: 56px;
        }

        .chapter-btn:hover {
            background: var(--violet-light);
            color: white;
            border-color: var(--violet-light);
        }

        .chapter-btn.active {
            background: var(--violet);
            color: white;
            border-color: var(--violet);
        }

        /* Reading View */
        .reading-view {
            max-width: 700px;
            margin: 0 auto;
            padding: 32px 20px;
        }

        .chapter-title {
            font-size: 28px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 24px;
            text-align: center;
        }

        .verse {
            margin-bottom: 20px;
            padding: 16px;
            border-radius: 12px;
            transition: background 0.2s;
            cursor: pointer;
        }

        .verse:hover {
            background: var(--gray-light);
        }

        .verse.highlighted {
            background: rgba(107, 93, 211, 0.1);
            border-left: 4px solid var(--violet);
        }

        .verse-number {
            display: inline-block;
            background: var(--violet);
            color: white;
            font-weight: 700;
            font-size: 14px;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            text-align: center;
            line-height: 28px;
            margin-right: 12px;
            vertical-align: top;
        }

        .verse-text {
            display: inline;
            font-size: 18px;
            line-height: 1.8;
            color: var(--text-primary);
        }

        /* Navigation */
        .chapter-nav {
            display: flex;
            gap: 12px;
            margin: 32px 0;
            padding: 0 20px;
        }

        .nav-btn {
            flex: 1;
            background: var(--violet);
            color: white;
            border: none;
            padding: 16px 24px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: background 0.2s;
            min-height: 52px;
        }

        .nav-btn:hover {
            background: var(--violet-dark);
        }

        .nav-btn:disabled {
            background: var(--gray-light);
            color: var(--text-secondary);
            cursor: not-allowed;
        }

        /* Modal/Sidebar */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            display: none;
            backdrop-filter: blur(4px);
        }

        .modal-overlay.active {
            display: block;
        }

        .modal {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--bg-primary);
            border-radius: 24px 24px 0 0;
            padding: 24px;
            transform: translateY(100%);
            transition: transform 0.3s ease;
            z-index: 1001;
            max-height: 80vh;
            overflow-y: auto;
        }

        .modal.active {
            transform: translateY(0);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-title {
            font-size: 20px;
            font-weight: 700;
            color: var(--text-primary);
        }

        /* Search */
        .search-container {
            margin-bottom: 20px;
        }

        .search-input {
            width: 100%;
            padding: 16px;
            border: 2px solid var(--border-color);
            border-radius: 12px;
            font-size: 16px;
            background: var(--bg-primary);
            color: var(--text-primary);
        }

        .search-input:focus {
            outline: none;
            border-color: var(--violet);
        }

        .search-results {
            margin-top: 16px;
        }

        .search-result {
            padding: 16px;
            border-radius: 12px;
            background: var(--bg-secondary);
            margin-bottom: 12px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .search-result:hover {
            background: var(--gray-light);
        }

        .result-reference {
            font-weight: 700;
            color: var(--violet);
            margin-bottom: 4px;
        }

        .result-text {
            color: var(--text-secondary);
            font-size: 14px;
        }

        /* Bottom Navigation */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--bg-primary);
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-around;
            padding: 12px 0;
            z-index: 98;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            padding: 8px 16px;
            cursor: pointer;
            color: var(--text-secondary);
            background: none;
            border: none;
            min-width: 60px;
        }

        .nav-item.active {
            color: var(--violet);
        }

        .nav-item svg {
            width: 24px;
            height: 24px;
        }

        .nav-item span {
            font-size: 12px;
            font-weight: 500;
        }

        /* Favorites */
        .favorite-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 4px;
        }

        .favorite-btn svg {
            width: 20px;
            height: 20px;
            fill: none;
            stroke: var(--text-secondary);
            transition: all 0.2s;
        }

        .favorite-btn.active svg {
            fill: #EF4444;
            stroke: #EF4444;
        }

        /* Loading */
        .loading {
            display: flex;
            justify-content: center;
            padding: 40px;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid var(--gray-light);
            border-top-color: var(--violet);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Hidden */
        .hidden {
            display: none !important;
        }

        /* Responsive */
        @media (min-width: 768px) {
            .modal {
                left: 50%;
                transform: translateX(-50%) translateY(100%);
                max-width: 600px;
            }

            .modal.active {
                transform: translateX(-50%) translateY(0);
            }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="header">
        <h1 class="header-title" id="headerTitle">Bible Compagnon</h1>
        <div class="header-actions">
            <button class="icon-btn" id="searchBtn" title="Rechercher">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="11" cy="11" r="8"/>
                    <path d="m21 21-4.35-4.35"/>
                </svg>
            </button>
            <button class="icon-btn" id="themeBtn" title="Thème">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
                </svg>
            </button>
        </div>
    </header>

    <!-- Book Selector -->
    <div class="book-selector" id="bookSelector"></div>

    <!-- Main Content -->
    <main id="mainContent">
        <!-- Chapter Selector View -->
        <div id="chapterSelectorView" class="chapter-selector hidden">
            <h2 class="modal-title" id="bookTitle"></h2>
            <div class="chapter-grid" id="chapterGrid"></div>
        </div>

        <!-- Reading View -->
        <div id="readingView" class="reading-view hidden">
            <h2 class="chapter-title" id="chapterTitle"></h2>
            <div id="versesContainer"></div>
            <div class="chapter-nav">
                <button class="nav-btn" id="prevChapterBtn">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M15 18l-6-6 6-6"/>
                    </svg>
                    Précédent
                </button>
                <button class="nav-btn" id="nextChapterBtn">
                    Suivant
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M9 18l6-6-6-6"/>
                    </svg>
                </button>
            </div>
        </div>

        <!-- Favorites View -->
        <div id="favoritesView" class="reading-view hidden">
            <h2 class="chapter-title">Mes favoris</h2>
            <div id="favoritesContainer"></div>
        </div>

        <!-- Loading -->
        <div id="loadingView" class="loading">
            <div class="spinner"></div>
        </div>
    </main>

    <!-- Search Modal -->
    <div class="modal-overlay" id="searchOverlay"></div>
    <div class="modal" id="searchModal">
        <div class="modal-header">
            <h3 class="modal-title">Rechercher</h3>
            <button class="icon-btn" id="closeSearchBtn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="18" y1="6" x2="6" y2="18"/>
                    <line x1="6" y1="6" x2="18" y2="18"/>
                </svg>
            </button>
        </div>
        <div class="search-container">
            <input type="text" class="search-input" id="searchInput" placeholder="Rechercher un verset...">
        </div>
        <div class="search-results" id="searchResults"></div>
    </div>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav">
        <button class="nav-item active" id="navRead">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
                <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
            </svg>
            <span>Lire</span>
        </button>
        <button class="nav-item" id="navFavorites">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
            </svg>
            <span>Favoris</span>
        </button>
    </nav>

    <script src="js/app.js"></script>
</body>
</html>
