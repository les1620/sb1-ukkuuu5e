<!DOCTYPE html>
<html lang="fr-CA">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="Bible Compagnon - Un compagnon biblique simple et magnifique conçu pour approfondir votre relation avec Dieu. Disponible sur l'App Store.">
    <meta name="theme-color" content="#6B5DD3">

    <!-- Open Graph -->
    <meta property="og:title" content="Bible Compagnon - Une app Bible que vous allez adorer utiliser">
    <meta property="og:description" content="Un compagnon biblique simple et magnifique conçu pour approfondir votre relation avec Dieu.">
    <meta property="og:type" content="website">
    <meta property="og:image" content="/og-image.jpg">

    <!-- Apple -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">

    <title>Bible Compagnon - Une app Bible que vous allez adorer utiliser</title>

    <!-- Favicon SVG -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='45' fill='%236B5DD3'/%3E%3Cpath d='M35 40h30v5H35zM35 50h30v5H35zM35 60h20v5H35z' fill='white'/%3E%3C/svg%3E">

    <style>
        /* CSS Reset & Base */
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --violet: #6B5DD3;
            --violet-dark: #5B4DC3;
            --black: #1A1A1A;
            --gray: #6B7280;
            --white: #FFFFFF;
            --spacing-base: 24px;
            --radius: 16px;
        }

        html {
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', system-ui, sans-serif;
            font-size: 16px;
            line-height: 1.6;
            color: var(--black);
            background: var(--white);
            overflow-x: hidden;
        }

        /* Header */
        .header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 12px var(--spacing-base);
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .header-brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo {
            width: 40px;
            height: 40px;
            flex-shrink: 0;
        }

        .brand-text {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', system-ui, sans-serif;
            font-weight: 700;
            font-size: 18px;
            color: var(--black);
        }

        .badge {
            display: inline-block;
            background: var(--violet);
            color: white;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
            margin-left: 8px;
        }

        .menu-button {
            background: none;
            border: none;
            padding: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 44px;
            min-height: 44px;
        }

        .hamburger {
            width: 24px;
            height: 24px;
        }

        /* Main Content */
        main {
            padding: 0 var(--spacing-base);
        }

        section {
            margin-bottom: 48px;
        }

        /* App Store Banner */
        .app-store-banner {
            background: #F9FAFB;
            border: 1px solid #E5E7EB;
            border-radius: var(--radius);
            padding: 16px;
            margin-top: 24px;
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .app-icon {
            width: 64px;
            height: 64px;
            border-radius: 14px;
            background: linear-gradient(135deg, var(--violet) 0%, #8B7DE8 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            box-shadow: 0 4px 12px rgba(107, 93, 211, 0.2);
        }

        .app-icon svg {
            width: 40px;
            height: 40px;
        }

        .app-info {
            flex: 1;
        }

        .app-name {
            font-weight: 600;
            font-size: 16px;
            color: var(--black);
            margin-bottom: 2px;
        }

        .app-rating {
            display: flex;
            align-items: center;
            gap: 4px;
            margin-bottom: 4px;
        }

        .stars {
            display: flex;
            gap: 2px;
        }

        .star {
            width: 14px;
            height: 14px;
            color: #9CA3AF;
        }

        .app-category {
            font-size: 13px;
            color: var(--gray);
        }

        .view-button {
            background: var(--violet);
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            min-width: 44px;
            min-height: 44px;
            transition: background 0.2s;
        }

        .view-button:active {
            background: var(--violet-dark);
        }

        /* Hero Section */
        .hero {
            text-align: center;
            margin-top: 48px;
        }

        .hero h1 {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', system-ui, sans-serif;
            font-weight: 700;
            font-size: clamp(32px, 8vw, 40px);
            line-height: 1.2;
            color: var(--black);
            margin-bottom: 20px;
        }

        .hero .highlight {
            color: var(--violet);
        }

        .hero p {
            font-size: 18px;
            line-height: 1.6;
            color: var(--gray);
            max-width: 500px;
            margin: 0 auto 40px;
        }

        /* CTA Section */
        .cta-section {
            text-align: center;
        }

        .cta-button {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            background: var(--violet);
            color: white;
            border: none;
            padding: 18px 32px;
            border-radius: var(--radius);
            font-weight: 600;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 16px rgba(107, 93, 211, 0.3);
            min-height: 56px;
        }

        .cta-button:hover {
            background: var(--violet-dark);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(107, 93, 211, 0.4);
        }

        .cta-button:active {
            transform: translateY(0);
        }

        .apple-icon {
            width: 24px;
            height: 24px;
        }

        .secondary-text {
            margin-top: 16px;
            font-size: 14px;
            color: var(--gray);
        }

        /* Mockup Section */
        .mockup-section {
            text-align: center;
            margin-top: 64px;
            margin-bottom: 80px;
        }

        .iphone-mockup {
            max-width: 320px;
            margin: 0 auto;
            filter: drop-shadow(0 20px 40px rgba(0, 0, 0, 0.15));
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0px);
            }
            50% {
                transform: translateY(-10px);
            }
        }

        .iphone-mockup img {
            width: 100%;
            height: auto;
            border-radius: 40px;
        }

        /* Animations */
        @media (prefers-reduced-motion: no-preference) {
            .fade-in {
                opacity: 0;
                animation: fadeIn 0.6s ease-out forwards;
            }

            @keyframes fadeIn {
                to {
                    opacity: 1;
                }
            }

            .slide-up {
                opacity: 0;
                transform: translateY(20px);
                animation: slideUp 0.6s ease-out forwards;
            }

            @keyframes slideUp {
                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }
        }

        /* Responsive */
        @media (min-width: 768px) {
            main {
                max-width: 600px;
                margin: 0 auto;
            }
        }

        /* Touch optimization */
        @media (hover: none) and (pointer: coarse) {
            .cta-button:hover {
                transform: none;
            }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="header-brand">
            <svg class="logo" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                <!-- Robot mascotte bleu-violet sympathique -->
                <defs>
                    <linearGradient id="robotGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" style="stop-color:#6B5DD3;stop-opacity:1" />
                        <stop offset="100%" style="stop-color:#8B7DE8;stop-opacity:1" />
                    </linearGradient>
                </defs>

                <!-- Corps du robot -->
                <rect x="25" y="35" width="50" height="45" rx="8" fill="url(#robotGradient)"/>

                <!-- Tête -->
                <rect x="30" y="15" width="40" height="25" rx="6" fill="url(#robotGradient)"/>

                <!-- Antenne -->
                <circle cx="50" cy="10" r="3" fill="#8B7DE8"/>
                <line x1="50" y1="13" x2="50" y2="15" stroke="#8B7DE8" stroke-width="2"/>

                <!-- Yeux (sympathiques) -->
                <circle cx="40" cy="25" r="4" fill="white"/>
                <circle cx="60" cy="25" r="4" fill="white"/>
                <circle cx="41" cy="26" r="2" fill="#1A1A1A"/>
                <circle cx="61" cy="26" r="2" fill="#1A1A1A"/>

                <!-- Sourire -->
                <path d="M 38 32 Q 50 36 62 32" stroke="white" stroke-width="2" fill="none" stroke-linecap="round"/>

                <!-- Livre Bible sur le corps -->
                <rect x="38" y="48" width="24" height="18" rx="2" fill="white" opacity="0.9"/>
                <line x1="50" y1="50" x2="50" y2="64" stroke="#6B5DD3" stroke-width="1"/>
                <line x1="42" y1="54" x2="48" y2="54" stroke="#6B5DD3" stroke-width="1.5"/>
                <line x1="42" y1="58" x2="48" y2="58" stroke="#6B5DD3" stroke-width="1.5"/>
                <line x1="52" y1="54" x2="58" y2="54" stroke="#6B5DD3" stroke-width="1.5"/>
                <line x1="52" y1="58" x2="58" y2="58" stroke="#6B5DD3" stroke-width="1.5"/>

                <!-- Bras -->
                <rect x="18" y="45" width="7" height="20" rx="3" fill="#8B7DE8"/>
                <rect x="75" y="45" width="7" height="20" rx="3" fill="#8B7DE8"/>

                <!-- Jambes -->
                <rect x="32" y="80" width="12" height="15" rx="3" fill="#8B7DE8"/>
                <rect x="56" y="80" width="12" height="15" rx="3" fill="#8B7DE8"/>
            </svg>
            <div>
                <span class="brand-text">Bible Compagnon</span>
                <span class="badge">Disponible maintenant</span>
            </div>
        </div>
        <button class="menu-button" aria-label="Menu">
            <svg class="hamburger" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="3" y1="6" x2="21" y2="6"/>
                <line x1="3" y1="12" x2="21" y2="12"/>
                <line x1="3" y1="18" x2="21" y2="18"/>
            </svg>
        </button>
    </header>

    <main>
        <!-- App Store Banner -->
        <section class="app-store-banner fade-in">
            <div class="app-icon">
                <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                    <rect x="20" y="25" width="60" height="55" rx="4" fill="white" opacity="0.9"/>
                    <path d="M50 25 L50 80" stroke="white" stroke-width="3"/>
                    <path d="M30 40 L45 40 M30 50 L45 50 M30 60 L45 60" stroke="rgba(255,255,255,0.8)" stroke-width="2.5" stroke-linecap="round"/>
                    <path d="M55 40 L70 40 M55 50 L70 50 M55 60 L70 60" stroke="rgba(255,255,255,0.8)" stroke-width="2.5" stroke-linecap="round"/>
                </svg>
            </div>
            <div class="app-info">
                <div class="app-name">Bible Compagnon</div>
                <div class="app-rating">
                    <div class="stars">
                        <svg class="star" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
                        </svg>
                        <svg class="star" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
                        </svg>
                        <svg class="star" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
                        </svg>
                        <svg class="star" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
                        </svg>
                        <svg class="star" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
                        </svg>
                    </div>
                </div>
                <div class="app-category">Livres et références</div>
            </div>
            <button class="view-button">Voir</button>
        </section>

        <!-- Hero Section -->
        <section class="hero slide-up">
            <h1>Une app Bible que vous allez <span class="highlight">adorer utiliser</span></h1>
            <p>Un compagnon biblique simple et magnifique conçu pour approfondir votre relation avec Dieu.</p>
        </section>

        <!-- CTA Section -->
        <section class="cta-section slide-up">
            <button class="cta-button">
                <svg class="apple-icon" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.24 2.31-.93 3.57-.84 1.51.12 2.65.72 3.4 1.8-3.12 1.87-2.38 5.98.48 7.13-.57 1.5-1.31 2.99-2.54 4.09l.01-.01zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.29 2.58-2.34 4.5-3.74 4.25z"/>
                </svg>
                Télécharger
            </button>
            <p class="secondary-text">Disponible maintenant sur l'App Store</p>
        </section>

        <!-- Mockup Section -->
        <section class="mockup-section">
            <div class="iphone-mockup">
                <svg viewBox="0 0 320 640" xmlns="http://www.w3.org/2000/svg">
                    <!-- iPhone Frame -->
                    <rect width="320" height="640" rx="40" fill="#1A1A1A"/>
                    <rect x="8" y="8" width="304" height="624" rx="35" fill="white"/>

                    <!-- Status Bar -->
                    <text x="20" y="35" font-family="SF Pro Text, -apple-system" font-size="14" font-weight="600">9:41</text>
                    <g transform="translate(260, 24)">
                        <rect x="0" y="2" width="18" height="10" rx="2" fill="none" stroke="#1A1A1A" stroke-width="1.5"/>
                        <rect x="18" y="5" width="2" height="4" rx="0.5" fill="#1A1A1A"/>
                        <rect x="2" y="4" width="14" height="6" fill="#1A1A1A"/>
                    </g>

                    <!-- Navigation -->
                    <g transform="translate(0, 60)">
                        <text x="160" y="0" text-anchor="middle" font-family="SF Pro Display, -apple-system" font-size="18" font-weight="700" fill="#1A1A1A">1 Corinthiens</text>
                    </g>

                    <!-- Chapter Indicator -->
                    <g transform="translate(0, 100)">
                        <rect x="130" y="0" width="60" height="32" rx="16" fill="#F3F4F6"/>
                        <text x="160" y="22" text-anchor="middle" font-family="SF Pro Text" font-size="16" font-weight="600" fill="#6B5DD3">Ch. 13</text>
                    </g>

                    <!-- Bible Text Content -->
                    <g transform="translate(24, 160)">
                        <!-- Verse 1 -->
                        <text font-family="SF Pro Text, -apple-system" font-size="18" fill="#1A1A1A">
                            <tspan x="0" y="0" font-weight="700" fill="#6B5DD3">1</tspan>
                            <tspan x="20" y="0">Quand je parlerais les langues</tspan>
                            <tspan x="0" y="28">des hommes et des anges, si je</tspan>
                            <tspan x="0" y="56">n'ai pas l'amour, je ne suis</tspan>
                            <tspan x="0" y="84">qu'un airain qui résonne ou</tspan>
                            <tspan x="0" y="112">une cymbale qui retentit.</tspan>
                        </text>

                        <!-- Verse 2 -->
                        <text font-family="SF Pro Text, -apple-system" font-size="18" fill="#1A1A1A">
                            <tspan x="0" y="160" font-weight="700" fill="#6B5DD3">2</tspan>
                            <tspan x="20" y="160">Et quand j'aurais le don de</tspan>
                            <tspan x="0" y="188">prophétie, la science de tous</tspan>
                            <tspan x="0" y="216">les mystères et toute la</tspan>
                            <tspan x="0" y="244">connaissance...</tspan>
                        </text>

                        <!-- Verse 4 -->
                        <text font-family="SF Pro Text, -apple-system" font-size="18" fill="#1A1A1A">
                            <tspan x="0" y="292" font-weight="700" fill="#6B5DD3">4</tspan>
                            <tspan x="20" y="292">L'amour est patient, il est</tspan>
                            <tspan x="0" y="320">plein de bonté; l'amour n'est</tspan>
                            <tspan x="0" y="348">point envieux; l'amour ne se</tspan>
                            <tspan x="0" y="376">vante point...</tspan>
                        </text>
                    </g>

                    <!-- Bottom Navigation Bar -->
                    <g transform="translate(0, 590)">
                        <rect x="24" y="0" width="272" height="40" rx="20" fill="#F9FAFB"/>
                        <circle cx="80" cy="20" r="8" fill="#6B5DD3"/>
                        <circle cx="160" cy="20" r="6" fill="#D1D5DB"/>
                        <circle cx="240" cy="20" r="6" fill="#D1D5DB"/>
                    </g>

                    <!-- Notch -->
                    <rect x="120" y="0" width="80" height="30" rx="15" fill="#1A1A1A"/>
                </svg>
            </div>
        </section>
    </main>

    <script>
        // Smooth animations on scroll
        if ('IntersectionObserver' in window) {
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.style.animationPlayState = 'running';
                    }
                });
            }, {
                threshold: 0.1
            });

            document.querySelectorAll('.fade-in, .slide-up').forEach(el => {
                observer.observe(el);
            });
        }

        // CTA Button interaction
        document.querySelector('.cta-button').addEventListener('click', () => {
            // Simule l'ouverture de l'App Store
            console.log('Redirection vers l\'App Store...');
            // window.location.href = 'https://apps.apple.com/...';
        });

        // View button interaction
        document.querySelector('.view-button').addEventListener('click', () => {
            console.log('Voir sur l\'App Store...');
        });

        // Menu button
        document.querySelector('.menu-button').addEventListener('click', () => {
            console.log('Menu ouvert');
        });

        // Performance: Lazy load mockup if needed
        if ('loading' in HTMLImageElement.prototype) {
            // Native lazy loading supported
            console.log('Lazy loading supporté');
        }
    </script>
</body>
</html>
